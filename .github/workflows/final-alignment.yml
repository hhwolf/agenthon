name: Final alignment compatibility
on:
  pull_request:
    paths:
      - 't2agent/**'
      - 't2eval/**'
      - 'tests/test*alignment*.py'
      - 'scripts/setup_final_alignment.sh'
      - 'reports/final_alignment/constraints-current.txt'
      - '.github/workflows/final-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Isolated release and current evaluation environments
        run: |
          bash scripts/setup.sh
          bash scripts/setup_final_alignment.sh
      - name: Current scorer and compatibility regressions
        run: .venv-current/bin/python -m pytest tests/test_final_alignment.py tests/test_alignment_review.py
      - name: Build explicit compatibility profile only
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg DEFAULT_FORECASTER=numeric_alignment \
            -t agenthon-alignment:ci .
          docker run --rm --network=none agenthon-alignment:ci python -c \
            'import json,pathlib; p=pathlib.Path("/app"); assert not (p/"t2eval").exists(); assert not list(p.rglob("*.parquet")); assert not json.loads((p/"t2agent/text_config.json").read_text())["house_calls"]'
      - name: Expanded offline and restricted matrix without answer mounts
        run: |
          mkdir -p .context/empty-replay
          .venv-current/bin/python -m t2eval.mock_final \
            --image agenthon-alignment:ci --allow-local-image --units-root vendor/current/units \
            --units practice --network none --no-proxy-scores --seed 1111 --out .eval/alignment-offline
          for mode in canned chaos replay; do
            .venv-current/bin/python -m t2eval.mock_final \
              --image agenthon-alignment:ci --allow-local-image --units-root vendor/current/units \
              --units practice --network restricted --house-mode "$mode" \
              --replay-dir .context/empty-replay --no-proxy-scores --seed 1111 \
              --out ".eval/alignment-$mode"
          done
      - name: Require all inputs, zero requests, bounded outputs and runtime
        run: |
          .venv-current/bin/python - <<'PY'
          import json
          from pathlib import Path
          count = len(list(Path('vendor/current/units').glob('*/card.toml')))
          for mode in ['offline', 'canned', 'chaos', 'replay']:
              root = Path('.eval/alignment-'+mode)/'a'
              summary = json.loads((root/'summary.json').read_text())
              rows = json.loads((root/'cards.json').read_text())
              assert summary['statuses'] == {'passed':count}
              assert summary['requests_used'] == 0
              assert summary['mean_unit_wall_seconds'] <= 240
              assert max(r['wall_seconds'] for r in rows) < 600
              assert max(r['output_tree']['bytes'] for r in rows) < 64*1024**2
          PY
