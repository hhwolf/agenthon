[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2agent"
version = "0.1.0"
description = "Track 2 numeric baseline and local measurement harness"
requires-python = ">=3.13"
dependencies = ["numpy==2.1.3", "pandas==2.2.3", "pyarrow==18.1.0", "openai==3.31.0"]

[project.optional-dependencies]
eval = ["scipy>=1.14", "tomli-w==1.2.0", "pytest>=8", "matplotlib==3.11.2"]

[project.scripts]
t2-forecast = "t2agent.cli:main"
t2-eval = "t2eval.cli:main"

[tool.setuptools.packages.find]
include = ["t2agent*", "t2eval*"]

[tool.setuptools.package-data]
t2agent = ["numeric_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
